<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Preflight{% endblock %}</title>
<script>
  // до отрисовки, иначе моргнёт светлым
  (function(){var t=localStorage.getItem('pf-theme');if(t)document.documentElement.dataset.theme=t})();
</script>
<style>
:root, :root[data-theme="dark"]{
  --bg:#0a0d10; --surface:#11161b; --surface-2:#161d24; --surface-3:#1c252e;
  --line:#222c35; --line-soft:#1a232b;
  --ink:#eaf0f5; --ink-2:#9fb0bd; --ink-3:#6b7c89;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --thumb-bg:#fff;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e6eaef;
  --line:#dde2e8; --line-soft:#e8ecf1;
  --ink:#111820; --ink-2:#4a5867; --ink-3:#7b8896;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -14px rgba(16,24,40,.18);
  --thumb-bg:#fff;
}
:root{
  --brand:#f0463c; --brand-soft:rgba(240,70,60,.12);
  --stop:#f4574c; --warn:#e08600; --note:#2f7fe0; --ok:#0f9d6b;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme="dark"]{--warn:#f7a325;--note:#3b93f7;--ok:#1dbd7b}

*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  transition:background .2s var(--ease),color .2s var(--ease)}
a{color:inherit;text-decoration:none}
::selection{background:var(--brand-soft)}

/* ── шапка ── */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;
  padding:0 20px;height:56px;background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line-soft)}

.logo{display:flex;align-items:center;gap:9px;margin-right:16px;
  font-size:17px;font-weight:750;letter-spacing:-.5px;line-height:1}
.logo .mark{position:relative;width:26px;height:26px;border-radius:8px;flex:none;
  background:linear-gradient(145deg,#ff5a4f,#d2352b);display:grid;place-items:center;
  box-shadow:0 2px 10px -2px rgba(240,70,60,.65);
  transition:box-shadow .35s var(--ease)}
.logo .mark svg{width:15px;height:15px;stroke:#fff;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  transform-origin:50% 50%;
  animation:flip 5s var(--ease) infinite}
@keyframes flip{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}
.logo .mark::after{content:"";position:absolute;inset:-3px;border-radius:11px;
  border:1.5px solid var(--brand);opacity:0;transform:scale(.85);
  transition:opacity .35s var(--ease),transform .35s var(--ease)}
.logo:hover .mark{box-shadow:0 4px 16px -2px rgba(240,70,60,.85)}
.logo:hover .mark svg{animation:none;transform:rotate(180deg);
  transition:transform .45s var(--ease)}
.logo:hover .mark::after{opacity:.55;transform:scale(1)}
.logo .w2{color:var(--ink-3);transition:color .25s var(--ease)}
.logo:hover .w2{color:var(--ink-2)}

.tabs{display:flex;gap:2px;align-items:center}
.tab{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;
  font-size:13.5px;font-weight:500;color:var(--ink-3);
  transition:background .16s var(--ease),color .16s var(--ease)}
.tab svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tab:hover{color:var(--ink-2);background:var(--surface-2)}
.tab.on{color:var(--ink);background:var(--surface-3)}
.tab.on svg{color:var(--brand);opacity:1}

.grow{flex:1}
.me{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);
  padding:4px 8px 4px 4px;border-radius:999px;transition:background .16s var(--ease)}
.me:hover{background:var(--surface-2);color:var(--ink)}
.avatar{width:27px;height:27px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--surface-3);color:var(--ink-2);font-size:11px;font-weight:700;
  border:1px solid var(--line);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:64px;height:64px;font-size:22px}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;
  color:var(--ink-3);transition:.16s var(--ease);border:0;background:none;cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger{color:var(--brand)}
.icon-btn.danger:hover{background:var(--brand-soft);color:var(--stop)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .sun{display:block}[data-theme="dark"] .moon{display:none}
[data-theme="light"] .sun{display:none}[data-theme="light"] .moon{display:block}

/* ── каркас ── */
main{max-width:1220px;margin:0 auto;padding:30px 20px 90px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:20px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.6px;font-weight:680}
.lede{color:var(--ink-3);font-size:13.5px;margin-top:5px}
h2{font-size:12px;font-weight:640;margin:28px 0 11px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.9px}
h2:first-child{margin-top:0}
h3.sec{font-size:17px;font-weight:640;margin:0 0 8px;letter-spacing:-.2px;color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media(max-width:940px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ── формы ── */
input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 12px;transition:.16s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-3);
  background:var(--surface-3);box-shadow:0 0 0 3px var(--brand-soft)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:disabled,textarea:disabled,select:disabled{opacity:.55;cursor:not-allowed}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:11px;font-weight:600;color:var(--ink-3);
  margin:14px 0 5px;text-transform:uppercase;letter-spacing:.7px}
label:first-child{margin-top:0}
input[type=file]{font-size:13px;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
  background:var(--brand);color:#fff;font-weight:600;font-size:14px;
  padding:10px 18px;border-radius:10px;transition:.16s var(--ease);
  box-shadow:0 2px 10px -3px rgba(240,70,60,.55)}
.btn:hover{background:#f65a51;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.chip{padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);
  cursor:pointer;transition:.14s var(--ease)}
.chip:hover{color:var(--ink)}
.chip.pick-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok);color:var(--ok)}
.chip.pick-false{background:color-mix(in srgb,var(--stop) 15%,transparent);border-color:var(--stop);color:var(--stop)}
.chip.pick-missed{background:color-mix(in srgb,var(--warn) 15%,transparent);border-color:var(--warn);color:var(--warn)}

/* ── бейджи ── */
.b{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.b::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b.stop{background:color-mix(in srgb,var(--stop) 14%,transparent);color:var(--stop)}
.b.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.b.note{background:color-mix(in srgb,var(--note) 14%,transparent);color:var(--note)}
.b.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.b.dim{background:var(--surface-2);color:var(--ink-3)}
.b.plain::before{display:none}

/* ── таблицы ── */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--ink-2);font-weight:680;padding:14px 16px 10px}
td{padding:13px 16px;border-top:1px solid var(--line-soft);vertical-align:middle}
tbody tr{transition:background .13s var(--ease)}
tbody tr.hit:hover{background:var(--surface-2);cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2)}

/* ── находки ── */
.finding{padding:16px 18px;border-top:1px solid var(--line-soft);position:relative}
.finding:first-child{border-top:0}
.finding::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.finding.s3::before{background:var(--stop)}
.finding.s2::before{background:var(--warn)}
.finding.s1::before{background:var(--note)}
.finding h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.45}
.finding p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px}
.finding .foot{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:12px;flex-wrap:wrap}

/* ── плитки ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 17px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);font-weight:600}
.tile .v{font-size:27px;font-weight:680;letter-spacing:-.9px;margin-top:5px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.meter{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.meter i{height:100%;transition:width .3s var(--ease)}

/* ── прочее ── */
.files{margin:0;padding:0;list-style:none}
.files li{display:flex;gap:12px;align-items:center;padding:11px 20px;
  border-top:1px solid var(--line-soft);font-size:13.5px}
.files li:first-child{border-top:0}
.files .nm{flex:1;min-width:0;word-break:break-word}
.files .sz{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.thumbs{display:flex;gap:12px;flex-wrap:wrap;padding:18px 20px}
.thumbs a{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--thumb-bg);transition:.16s var(--ease);display:block}
.thumbs a:hover{transform:translateY(-2px)}
.thumbs img{display:block;max-width:200px;max-height:170px}
.blank{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:14px}
.blank svg{width:30px;height:30px;stroke:currentColor;stroke-width:1.5;fill:none;
  opacity:.4;margin-bottom:10px}
.hint{font-size:12px;color:var(--ink-3);padding:0 20px 16px}
.warnbox{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);
  background:color-mix(in srgb,var(--warn) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  font-size:13.5px;color:var(--ink-2)}
.warnbox svg{width:18px;height:18px;flex:none;stroke:var(--warn);stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
</style>
</head>
<body>
{% if user %}
<div class="top">
  <a href="/" class="logo" title="К сделкам">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span>pre<span class="w2">flight</span></span>
  </a>
  <div class="tabs">
    <a href="/" class="tab {{ 'on' if nav=='deals' }}">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Сделки</a>
    <a href="/runs" class="tab {{ 'on' if nav=='runs' }}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Проверки</a>
    <a href="/stats" class="tab {{ 'on' if nav=='stats' }}">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Статистика</a>
    <a href="/rules" class="tab {{ 'on' if nav=='rules' }}">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 13l2 2 4-4"/></svg>Правила</a>
    <a href="/notes" class="tab {{ 'on' if nav=='notes' }}">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Инструкции</a>
    <a href="/about" class="tab {{ 'on' if nav=='about' }}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>О сервисе</a>
  </div>
  <div class="grow"></div>
  <button class="icon-btn" onclick="toggleTheme()" title="Тема">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/></svg>
  </button>
  <a href="/profile" class="me" title="Профиль">
    <span class="avatar">
      {% if user['avatar'] %}<img src="/avatar/{{ user['id'] }}" alt="">{% else %}{{ user['name'][:1]|upper }}{% endif %}
    </span>{{ user['name'] }}
  </a>
  <a href="/settings" class="icon-btn" title="Настройки">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.33.4.6.73.77H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </a>
  <a href="/logout" class="icon-btn danger" title="Выйти">
    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
  </a>
</div>
{% endif %}
<main>{% block body %}{% endblock %}</main>
<script>
function toggleTheme(){
  var r=document.documentElement;
  var n=r.dataset.theme==='light'?'dark':'light';
  r.dataset.theme=n;localStorage.setItem('pf-theme',n);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
